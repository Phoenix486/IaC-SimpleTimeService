name: "Terraform Test"

on:
  pull_request:
    branches:
      - '*'


#Special permissions required for OIDC authentication
permissions:
  security-events: write # Needed to upload-sarif
  contents: read # Needed to clone repo
  actions: read # Potentially needed for private repositories (see https://github.com/github/codeql-action/issues/2117)

jobs: 
  check-code:
    runs-on: ubuntu-latest
    defaults:
        run:
          shell: bash
          working-directory: ./
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3

      - name: Terraform Init
        run: terraform init -backend=false

      # Run a terraform fmt to check syntax
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Run a terraform validate
      - name: Terraform Validate
        if: success() || failure()
        run: terraform validate -no-color

      - name: Security Scan with Policy
        uses: JashwanthMU/TerraSecure@0acb8549565b6b8dd09db06abb60656a84079de9
        with:
          format: 'sarif'
          fail-on: 'high'
          upload-sarif: 'true'
